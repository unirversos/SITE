<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deslocamento · Unirversos Travessia</title>
<meta name="description" content="De onde para onde? Distância, tempo e passagem estimada entre dois lugares da sua viagem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>

:root{
  --paper:#fdf6f4; --card:#ffffff; --ink:#3a2b38; --muted:#6b5a67; --line:#ecdadd;
  --pink:#c23f5e; --pink-d:#a8344f; --gold:#8e6a1f; --gold-soft:#fbf2df; --sage:#4f7461; --sage-soft:#e8efe8; --lavender:#b7a6dc; --red:#a8344f;
  --f-display:"Baloo 2","Zen Maru Gothic",system-ui,sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--lavender);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:26px}
.wrap>*{min-width:0}
.sitebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 18px}
.logo{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.14em;text-decoration:none}
.logo span{color:var(--pink)}
.navlinks{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px}
.navlinks a{text-decoration:none;color:var(--muted)}
.navlinks a:hover{color:var(--pink)}
.navlinks a[aria-current="page"]{color:var(--ink);border-bottom:2px solid var(--pink)}
.crumb{font-size:14px;color:var(--muted)}
.crumb a{color:var(--pink);text-decoration:none}
.btn{font:inherit;font-family:var(--f-display);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);line-height:1.3}
.btn:hover{border-color:var(--pink)}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.sm{padding:4px 12px;font-size:13.5px}

.pagina{max-width:560px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,38px);line-height:1.1;margin:0}
h1 em{font-style:normal;color:var(--pink)}
.rota{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;box-shadow:0 10px 24px -20px rgba(58,43,56,.4)}
.rota label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.rota input{font:inherit;font-size:17px;color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;width:100%;min-width:0}
.troca{justify-self:center;font:inherit;font-size:20px;border:1.5px solid var(--line);background:#fff;border-radius:999px;width:42px;height:42px;cursor:pointer}
.troca:hover{border-color:var(--pink)}
.sug{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.sug button{flex:none;font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;text-align:left}
.sug button small{display:block;color:var(--muted);font-size:11.5px}
.sug button:hover{border-color:var(--pink)}
.res{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.km{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1}
.km small{font-size:18px;font-weight:700;color:var(--muted)}
.tempos{display:flex;gap:10px;flex-wrap:wrap}
.tempos div{flex:1 1 130px;background:var(--sage-soft);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted)}
.tempos small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.conf{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px;margin:8px 0}
.conf small{color:var(--muted);font-size:12.5px}
.conf label{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:700}
.conf input{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff}
.tempos b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink)}
.preco{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.preco label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.preco input{font:inherit;font-size:18px;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;width:130px}
.preco input.ok{border-color:var(--sage);background:#f3f8f3}
.preco .rs{font-family:var(--f-display);font-weight:800;font-size:20px;padding-bottom:8px}
.preco .tg{font-size:12.5px;color:var(--muted);padding-bottom:10px}
.preco .tg.ok{color:var(--sage);font-weight:700}
.modos{display:flex;gap:6px;flex-wrap:wrap}
.md{font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.md:hover{border-color:var(--pink)}
.md small{display:block;font-size:11.5px;font-weight:500;opacity:.85}
.md.on{background:var(--ink);border-color:var(--ink);color:#fff}
.nt{margin:0;font-size:13px;color:var(--muted)}
.aviso{background:var(--gold-soft);border:1.5px solid #ecd9a8;border-radius:14px;padding:10px 12px;font-size:13.5px}
.est{font-size:14px;color:var(--muted);line-height:1.7}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.salva{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
html.embed .sitebar,html.embed .crumb,html.embed h1,html.embed .rodape,html.embed #minhas,html.embed .sug{display:none!important}
html.embed body{background:#fff}
html.embed .pagina{padding-top:8px}
.salva label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.salva input{font:inherit;font-size:16px;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
.minhas{display:grid;gap:12px}
.minhas h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:6px 0 0}
.tots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tots div{background:var(--sage-soft);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.tots b small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.tots b{display:block;font-family:var(--f-display);font-size:16px;color:var(--ink);line-height:1.3}
.pas{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.pas.comprado{border-color:var(--sage)}.pas.cancelado{opacity:.55}
.ph{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.md2{font-size:13px;color:var(--muted)}
.pl{font-size:14.5px}
.pr{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.pr label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:700}
.pr select,.pr input{font:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;min-width:0}
.onde{font-size:13.5px}.onde a{color:var(--pink);font-weight:700;margin-right:4px}.onde small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.vazio{color:var(--muted);text-align:center;padding:6px}
.rodape{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;color:var(--muted);font-size:14px;border-top:1.5px solid var(--line);padding-top:16px}
.rodape a{color:var(--pink);text-decoration:none;margin-right:12px}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head>
<body>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('embed');</script>
<div class="pagina">
  <div class="sitebar" role="navigation" aria-label="Site">
    <a href="/" class="logo">UNI<span>R</span>VERSOS</a>
    <span class="navlinks"><a href="/idiomas/">idiomas</a><a href="/travessia/">travessia</a><a href="/paralelos/">paralelos</a><a href="/loja/">tesouros</a><a href="/sobre/">sobre</a></span>
  </div>
  <p class="crumb"><a href="/travessia/calendario/">← Calendário</a></p>
  <h1>De <em>→</em> para</h1>

  <div class="rota">
    <label>De<input id="de" list="lugares" autocomplete="off" placeholder="onde você está"></label>
    <button class="troca" type="button" id="troca" aria-label="Trocar de e para">⇅</button>
    <label>Para<input id="para" list="lugares" autocomplete="off" placeholder="onde quer ir"></label>
    <datalist id="lugares"></datalist>
  </div>
  <div class="sug" id="sug" aria-label="Sugestões do seu calendário"></div>

  <div id="res" class="res" hidden></div>
  <div id="vazio" class="vazio"></div>
  <section id="minhas" class="minhas" hidden></section>

  <footer class="rodape"><span>unirversos — tudo conectado · Aline Kikuti</span><span><a href="/travessia/calendario/">Calendário</a></span></footer>
</div>
<script src="../calendario/geo.js?v=3"></script>
<script src="../agendamentos/regras.js?v=1"></script>
<script src="../calendario/avisos.js?v=2"></script>
<script src="./deslocamento.js?v=13"></script>
</body>
</html>
