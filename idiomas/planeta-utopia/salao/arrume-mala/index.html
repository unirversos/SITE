<style>
:root{
  --paper:#fdf6f4; --card:#ffffff; --ink:#3a2b38; --muted:#6b5a67; --line:#ecdadd;
  --blush:#f8dde1; --pink:#c23f5e; --pink-d:#b23a57; --sage:#4f7a58; --sage-soft:#e8efe8; --taupe:#816c5b; --gold:#8f6b1d; --gold-soft:#fbf1d9;
  --f-display:"Baloo 2","Zen Maru Gothic",system-ui,sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 60px}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #b7a6dc;outline-offset:3px;border-radius:8px}
.wrap{max-width:600px;margin:0 auto;display:grid;gap:14px}
.sitebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 18px}
.logo{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.14em;text-decoration:none}
.logo span{color:var(--pink)}
.voltar{font-size:13.5px;color:var(--muted);text-decoration:none}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.1;margin:0}
h2{font-family:var(--f-display);font-size:19px;line-height:1.2;margin:0}
h3{font-family:var(--f-display);font-size:16px;line-height:1.25;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pink-d);font-weight:700;margin:0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:12px}
.sub{margin:0;color:var(--muted);font-size:14px}
.btn{font:inherit;font-weight:700;font-size:15px;min-height:46px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.peq{min-height:38px;font-size:13.5px;padding:0 12px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lk{font:inherit;font-size:13px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:40px;padding:0}
.nota{border-left:5px solid var(--sage);background:var(--sage-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:0}
[hidden]{display:none!important}
.wro{display:block;font-size:13px;color:var(--pink-d);font-weight:500}
.jp{font-weight:700}


.notif{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border:1.5px solid #e6cf9b;border-radius:16px;padding:10px 12px}
.notif .sino{font-size:26px}.notif b{font-family:var(--f-display);font-size:15px}.notif .bj{margin:2px 0;font-size:15.5px}.notif .btn{margin-top:4px}
.notif.mini{align-items:center;padding:6px 10px}.notif.mini .sino{font-size:20px}.notif.mini small{color:var(--muted);font-size:12.5px;display:block}.notif.mini>div{flex:1;font-size:14px}
.caixas{display:grid;gap:10px}
.caixa{border-radius:18px;padding:12px;min-height:84px;transition:box-shadow .15s}
.caixa.mala{background:linear-gradient(#cf9b70,#b9825a);border:3px solid #8a5a3c;position:relative;margin-top:12px}
.caixa.mala::before{content:'';position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:76px;height:14px;border:3px solid #8a5a3c;border-bottom:0;border-radius:12px 12px 0 0}
.caixa.mochila{background:linear-gradient(#7d9a86,#5f7f6b);border:3px solid #435f4e}
.rot{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.caixa .rot{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}.quarto .rot{color:var(--muted)}
.caixa.alvo,.quarto.alvo{box-shadow:0 0 0 4px var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vazio{font-size:13px;color:rgba(255,255,255,.85)}.quarto .vazio{color:var(--muted)}
.quarto{display:grid;gap:10px;border:2px dashed #cdb9bd;border-radius:18px;padding:10px 12px;background:#fff}
.movel .chips{min-height:48px}
.mi{touch-action:none;user-select:none;-webkit-user-select:none;font:inherit;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:grab;min-height:46px;text-align:left}
.mi .ic{font-size:24px;line-height:1}.mi .tx{display:grid;line-height:1.15;font-size:14px}.mi small{font-size:11px;color:var(--muted)}.mi .wro{font-size:10.5px}
.mi.sel{border-color:var(--pink);box-shadow:0 0 0 3px var(--blush)}
.mi.gh{position:fixed;z-index:99;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.28);padding:8px;transform:scale(1.15)}
.mi.brilha{animation:brilha 1.2s ease-in-out infinite}
@keyframes brilha{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.0);border-color:var(--line)}50%{box-shadow:0 0 0 5px rgba(212,160,23,.55);border-color:#d4a017}}
.mi.treme{animation:treme .4s}
@keyframes treme{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin:0;color:var(--pink-d);font-weight:700;font-size:14.5px}.pt{font-weight:400;color:var(--muted)}
.dica{font-size:13.5px}
.jp{word-break:keep-all;overflow-wrap:anywhere}
#jogo{display:grid;gap:12px}
#jogo.fechando .caixa.mala{animation:fecha .65s ease-in forwards}
@keyframes fecha{0%{transform:none}60%{transform:scaleY(.82)}100%{transform:scaleY(.7);opacity:.7}}
#final{display:grid;gap:12px}
.cena{position:relative;height:150px;border-radius:20px;border:1.5px solid var(--line);display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:0 12px 14px;overflow:hidden}
.cena.neve{background:linear-gradient(#cfe4f3,#f4f9fd 70%,#fff)}.cena.aero{background:linear-gradient(#e3e1ee,#f3f1f8 70%,#fff)}
.cena .placa{position:absolute;top:8px;left:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;padding:2px 10px}
.cena .av{font-size:64px;line-height:1}.cena .esteira{font-size:30px;letter-spacing:4px}
.cena .pensa{position:absolute;top:34px;right:14px;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:6px 14px;font-size:30px;text-align:center;line-height:1.1}.cena .pensa small{display:block;font-size:11px;color:var(--muted)}
.estr{font-size:17px;white-space:nowrap}
.bal{background:#eef4fb;border-radius:18px;padding:10px 14px;display:grid;gap:4px;font-size:16px}.bal.ag{background:#f1efe9}.bal .who{font-size:12px;font-weight:700;color:var(--muted)}
.bal .btn{justify-self:start}
.aprendi summary{cursor:pointer;font-weight:700;color:var(--muted)}.aprendi ul{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;font-size:14.5px}
footer{border-top:1.5px dashed var(--line);padding-top:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
@media (prefers-reduced-motion:reduce){.mi.brilha,.mi.treme{animation:none}.mi.brilha{border-color:#d4a017;border-width:3px}}
</style>
