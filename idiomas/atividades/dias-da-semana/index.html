<!DOCTYPE html>
<html lang="pt-BR" data-login="obrigatorio">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dias da semana · Atividades Unirversos</title>
<style>html[data-login="obrigatorio"]:not(.uni-ok) body>*:not(#uni-gate){visibility:hidden}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{--ink:#3a2b38;--muted:#7a6a76;--line:#efe3e5;--bg:#fdf8f6;--pink:#c23f5e;--pink-d:#a8324f;--sage:#517158;--sage-s:#e8efe8;--gold:#a0712a;--gold-s:#fbf1de;--terra:#b0583a;--terra-s:#f8e6de;--lav:#6f5fa8;--lav-s:#f3f0fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Zen Maru Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:820px;margin:0 auto;padding:28px 20px 80px}
@media(min-width:760px){.w{padding-right:70px}}
a{color:inherit}.voltar{font-size:13px;color:var(--muted);text-decoration:none}
.ey{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:16px 0 0}
h1{font-family:"Baloo 2",sans-serif;font-size:34px;line-height:1.15;margin:6px 0 0}h1 .k{color:var(--lav)}h1 .m{color:var(--pink)}
.bar0{height:3px;width:56px;background:var(--sage);border-radius:2px;margin:10px 0 10px}
.sub{margin:0;color:var(--muted);max-width:40em}
.quem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14px}
.quem select{font:inherit;padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;background:#fff}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--gold-s);color:var(--gold)}
.aviso{background:var(--gold-s);color:#7a5418;border-radius:12px;padding:10px 14px;font-size:14px;margin-top:16px}
.salvo{font-size:12.5px;color:var(--muted)}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;padding:10px 20px;min-height:42px;cursor:pointer;background:var(--pink);color:#fff}
.btn.claro{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
/* resumo */
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media(max-width:640px){.resumo{grid-template-columns:1fr}}
.rs{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px;font-size:14px}
.rs b{font-family:"Baloo 2",sans-serif;font-size:24px;color:var(--c);margin-right:6px}.rs p{margin:4px 0 0}
.dica{background:var(--sage-s);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:12px}
/* progresso */
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin-top:16px}
.prog-t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.prog-t b{color:var(--ink)}
.prog-b{height:8px;background:#f1e8ea;border-radius:999px;overflow:hidden;margin-top:6px}.prog-b i{display:block;height:100%;background:var(--sage);transition:width .3s}
/* seções */
section.sec{margin-top:26px}
.sec-h{display:flex;gap:12px;align-items:baseline;border-bottom:1.5px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.sec-h .n{font-family:"Baloo 2",sans-serif;font-size:24px;color:var(--c)}
.sec-h h2{margin:0;font-family:"Baloo 2",sans-serif;font-size:21px}
.inst{margin:4px 0 12px;color:var(--muted);font-size:14px}
.q{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.q.ok{border-left-color:var(--sage)}.q.erro{border-left-color:var(--terra)}
.jp{font-size:19px;line-height:2}
.q .ro{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);display:none}
.q.vis .ro{display:block}
.tr{font-size:13px;color:var(--muted);margin:2px 0 0}.tr i{font-style:normal;opacity:.75}
.ver{font:inherit;font-size:12px;color:var(--pink-d);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
select.lac{font:inherit;font-size:17px;padding:2px 8px;margin:0 4px;border:1.5px solid #d8d0ee;border-radius:10px;background:var(--lav-s);color:var(--lav);font-weight:700}
select.lac.ok{border-color:var(--sage);background:var(--sage-s);color:var(--sage)}select.lac.erro{border-color:var(--terra);background:var(--terra-s);color:var(--terra)}
.fb{font-size:13.5px;font-weight:700;margin-top:6px}.fb.ok{color:var(--sage)}.fb.erro{color:var(--terra)}
/* placa */
.placa{background:#fffaf0;border:1.5px solid #ecd9a8;border-radius:16px;padding:14px 16px;margin-bottom:12px;max-width:520px}
.placa .tp{text-align:center;font-weight:700;color:var(--gold);font-size:13px}.placa h3{text-align:center;margin:2px 0 8px;font-family:"Baloo 2",sans-serif;font-size:20px}
.placa table{width:100%;border-collapse:collapse;font-size:14px}.placa td{padding:6px 4px;border-top:1px solid #f0e3c4}.placa td small{display:block;color:var(--muted);font-size:12px}
.placa td.h{text-align:right;font-family:ui-monospace,monospace;font-weight:700;white-space:nowrap}
.vf{display:flex;gap:8px;margin-top:8px}.vf button{font:inherit;font-weight:700;flex:1;max-width:180px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px;cursor:pointer}
.vf button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.vf button.ok{border-color:var(--sage);background:var(--sage-s);color:var(--sage)}.vf button.erro{border-color:var(--terra);background:var(--terra-s);color:var(--terra)}
/* montar */
.alvo{min-height:52px;border:1.5px dashed #d9c6cb;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;background:#fffdfc}
.alvo:empty::before{content:"Toque nos blocos abaixo para montar a frase";color:var(--muted);font-size:13px;padding:0 4px}
.blocos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bl{font:inherit;font-size:17px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 12px;cursor:pointer}
.bl:disabled{opacity:.25;cursor:default}
.alvo .bl{background:var(--lav-s);border-color:#d8d0ee}
.modo{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;margin-top:6px}
.dig{width:100%;font:inherit;font-size:17px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px}
.fim{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px}
.nota{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--sage);border-radius:14px;padding:12px 16px;margin-top:16px;font-size:15px}.nota b{font-family:"Baloo 2",sans-serif;font-size:26px;color:var(--sage)}
/* guia */
.intro{display:grid;gap:8px;margin-top:6px}.intro p{margin:0;background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:14px}
.dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.dia{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px;font-size:13.5px}
.dia .kj{font-size:30px;line-height:1.2;display:flex;align-items:center;gap:8px;justify-content:space-between}
.dia .le{font-weight:700;color:var(--c)}.dia .pt{font-family:"Baloo 2",sans-serif;font-size:17px;margin:2px 0}
.dia .as{color:var(--muted);font-size:12.5px}.dia p{margin:6px 0 0}
.som{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
details.mito{margin-top:14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
details.mito summary{cursor:pointer;font-weight:700;color:var(--lav)}
.mt{display:grid;gap:8px;margin-top:10px}.mt div{border-left:4px solid var(--c);padding:4px 10px;font-size:13.5px}.mt b{font-size:15px}.mt small{display:block;color:var(--muted)}
/* cards */
.abas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;min-height:36px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fc{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--c);border-radius:16px;padding:14px;min-height:190px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:var(--ink)}
.fc .tt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fc .fr{font-size:44px;line-height:1.2;text-align:center;margin:auto 0}
.fc .vr{font-size:13.5px;margin:0;padding-left:18px}.fc .vr li{margin:2px 0}
.fc .rp{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:auto}
.fc .vira{font-size:12px;color:var(--pink-d);text-align:center}
/* jogo */
.op{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media(max-width:560px){.op{grid-template-columns:1fr}}
.op button{font:inherit;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;min-height:44px}
.op button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.op button.ok{border-color:var(--sage);background:var(--sage-s);color:var(--sage);font-weight:700}.op button.erro{border-color:var(--terra);background:var(--terra-s);color:var(--terra)}
.q .cat{font-size:12px;color:var(--muted)}.q .kq{font-size:24px;margin-right:6px}
.q .dc{font-size:13.5px;background:var(--sage-s);border-radius:10px;padding:8px 12px;margin-top:8px}
[hidden]{display:none!important}
</style>

</head>
<body>
<div class="w">
  <a class="voltar" href="/idiomas/atividades/">← Atividades</a>
  <p class="ey">✦ Atividades Unirversos · N5</p>
  <h1><span lang="ja">曜日</span>: os dias da semana</h1><div class="bar0"></div>
  <p class="sub">Cada dia da semana em japonês leva o nome de um astro. Leia o guia, treine com os cards e jogue as 10 perguntas.</p>
  <div class="quem" id="quem"></div>
  <div id="aviso"></div>
  <div id="conteudo"></div>
</div>

<script src="/idiomas/atividades/frase-jp.js?v=7"></script>

</body>
</html>
