<!DOCTYPE html>
<html lang="pt-BR" data-login="obrigatorio">
<head>
<meta charset="UTF-8">
<style>
:root{
  --paper:#fdf6f4; --card:#ffffff; --ink:#3a2b38; --muted:#705f6c; --line:#ecdadd;
  --blush:#f8dde1; --pink:#c23f5e; --sage:#517158; --sage-soft:#e8efe8; --lavender:#b7a6dc;
  --f-display:"Baloo 2", "Zen Maru Gothic", system-ui, sans-serif;
  --f-body:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:18px}
a{color:inherit}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.sitebar{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.sitebar .brand{font-family:"Baloo 2",system-ui,sans-serif;font-size:18px;font-weight:700;text-decoration:none;color:var(--ink)}
.sitebar .brand span{color:var(--pink)}
.sitebar .navlinks{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.sitebar .navlinks a{color:var(--muted);text-decoration:none}
.sitebar .navlinks a:hover{color:var(--pink)}
.trail{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.trail a{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:700;text-decoration:none;color:var(--ink)}
.trail a:hover{border-color:var(--pink)}
.trail a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* caderno */
.cad{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:720px){.cad{grid-template-columns:minmax(0,1fr)}}
.lista{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.btn{font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:700;min-height:40px}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.sm{padding:4px 12px;min-height:34px;font-size:13px}
.btn:focus-visible,.item:focus-visible,#txt:focus-visible,#tit:focus-visible{outline:3px solid var(--lavender);outline-offset:2px}
.itens{display:grid;gap:6px;max-height:60vh;overflow:auto}
@media (max-width:720px){.itens{max-height:200px}}
.item{font:inherit;color:inherit;text-align:left;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;display:grid;gap:1px}
.item b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:12px}
.item[aria-current="true"]{border-color:var(--pink);background:#fff}
.vazio{color:var(--muted);font-size:14px;margin:4px 2px}
/* a página */
.folha{position:relative;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--pink);border-radius:var(--r);padding:16px 18px 12px;display:grid;gap:10px;box-shadow:0 14px 30px -20px rgba(58,43,56,.35)}
#tit{font-family:var(--f-display);font-weight:800;font-size:22px;border:0;border-bottom:1.5px dashed var(--line);background:transparent;color:var(--ink);padding:2px 0 8px;width:100%}
#txt{width:100%;min-height:52vh;resize:vertical;border:0;background:
  repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-attachment:local;
  font:inherit;font-size:16px;line-height:32px;color:var(--ink);padding:0}
/* cabeçalho de data em japonês */
.dia{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 22px;padding:2px 0 10px;border-bottom:1.5px dashed var(--line)}
.dt{display:flex;align-items:flex-end;gap:4px 6px;flex-wrap:wrap}
.dt input{font:inherit;font-family:var(--f-display);font-weight:700;font-size:20px;text-align:center;color:var(--ink);border:0;border-bottom:2px solid var(--line);background:transparent;border-radius:0;padding:0 2px;height:34px;-moz-appearance:textfield}
.dt input::-webkit-outer-spin-button,.dt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dt input:focus{outline:none;border-bottom-color:var(--pink)}
#ano{width:4.2ch}#mes,#dia{width:2.6ch}
.dt ruby{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink);margin-right:8px}
.dt rt,.sem rt{font-family:var(--f-body);font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.sem{display:flex;gap:4px}
.sem button{font:inherit;cursor:pointer;position:relative;width:40px;height:40px;border:0;background:transparent;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;display:grid;place-items:center;padding:0}
.sem button ruby{display:grid;justify-items:center}
.sem button::before{content:'';position:absolute;inset:0;border:2.5px solid var(--pink);border-radius:52% 48% 55% 45%/48% 55% 45% 52%;transform:rotate(-6deg) scale(.6);opacity:0;transition:opacity .15s,transform .15s}
.sem button[aria-pressed="true"]{color:var(--pink)}
.sem button[aria-pressed="true"]::before{opacity:1;transform:rotate(-6deg) scale(1)}
.sem button:hover::before{opacity:.35;transform:rotate(-6deg) scale(1)}
.sem button[aria-pressed="true"]:hover::before{opacity:1}
.sem button:focus-visible{outline:3px solid var(--lavender);outline-offset:1px;border-radius:50%}
@media (max-width:420px){.sem button{width:34px;height:36px;font-size:18px}.dt input,.dt ruby{font-size:18px}}
.modo{display:inline-flex;gap:4px;padding:3px;border-radius:99px;background:#fdf6f4;border:1.5px solid var(--line);justify-self:start}
.modo button{font:inherit;cursor:pointer;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13.5px;padding:5px 16px;border-radius:99px;min-height:34px}
.modo button[aria-pressed="true"]{background:var(--ink);color:#fff}
.modo button:focus-visible{outline:3px solid var(--lavender);outline-offset:2px}
.rod .acts2{display:flex;align-items:center;gap:8px}
.rod{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
@media (max-width:480px){#dicbt,#recolher{padding:8px 12px!important;margin-left:6px!important;font-size:13px!important}}
/* dicionário sanfonado: abre e fecha deslizando */
#dicbox{display:grid;grid-template-rows:0fr;margin:0;transition:grid-template-rows .28s ease,margin .28s ease;visibility:hidden}
#dicbox.on{grid-template-rows:1fr;margin:0 0 14px;visibility:visible}
#dicbox .dicin{overflow:hidden;min-height:0;background:#fff;border:0 solid #ecdadd;border-radius:18px;padding:0 14px;transition:padding .28s ease}
#dicbox.on .dicin{border-width:1.5px;padding:14px}
@media (prefers-reduced-motion:reduce){#dicbox,#dicbox .dicin{transition:none}}
</style>

<script defer src="/menu-ativo.js?v=2"></script><script defer src="/voltar-global.js?v=5"></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#3a2b38"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Unirversos"><script src="/app.js" defer></script><style id="uni-logo">.logo,.brand,.sitebar .brand{font-family:"Baloo 2","Zen Maru Gothic",system-ui,sans-serif!important;font-weight:800!important;font-size:19px!important;letter-spacing:.14em!important;text-transform:none!important;text-decoration:none!important}.logo span,.brand span{color:#c23f5e!important;font:inherit!important;letter-spacing:inherit!important;margin:0!important}</style></head>

<body>
<div class="wrap">
  <nav class="sitebar" aria-label="Site"><a class="brand" href="/">UNI<span>R</span>VERSOS</a><span class="navlinks"><a href="/idiomas/">idiomas</a><a href="/travessia/">travessia</a><a href="/loja/">tesouros</a><span class="nav-sep" aria-hidden="true" style="opacity:.3">|</span><a href="/paralelos/">paralelos</a><a href="/sobre/">sobre</a></span></nav>
  <nav class="trail" aria-label="Trilha"><a href="/idiomas/japones/">← Minha trilha</a></nav>
  <header>
    <button type="button" id="dicbt" style="float:right;margin:2px 0 8px 12px;font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line,#e7e1da);background:var(--card,#fff);color:inherit;border-radius:99px;padding:8px 18px;min-height:40px;cursor:pointer" aria-expanded="false" aria-controls="dicbox">📖 Dicionário</button><button type="button" id="recolher" style="float:right;margin:2px 0 8px 12px;font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line,#e7e1da);background:var(--card,#fff);color:inherit;border-radius:99px;padding:8px 18px;min-height:40px;cursor:pointer">Recolher ↘</button>
    <h1>Caderno de Unir Versos</h1>
    <p class="sub">Anotações livres, em páginas: escreva com o teclado e desenhe com a caneta por cima. Com a conta, tudo vai junto para qualquer aparelho.</p>
  </header>
  <section id="dicbox" aria-label="Dicionário"><div class="dicin"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-family:var(--f-display);font-size:18px">Dicionário</b><button type="button" id="dicx" aria-label="Fechar o dicionário" style="font:inherit;border:1.5px solid #ecdadd;background:#fff;border-radius:99px;width:36px;height:36px;cursor:pointer">×</button></div><div id="dicmt"></div></div></section>
  <div id="cad"></div>
</div>
<script src="/caderno-dados.js?v=2"></script>
<script src="/caderno-livro.js?v=11"></script>
<script src="/caderno-ui.js?v=4"></script>
<script src="/voltar.js?v=1"></script>
<script defer src="/bau-flutuante.js?v=9"></script>
<script>window.UniCadernoTela = UniCadernoUI.montar(document.getElementById('cad'));</script>
<script>
/* Dicionário: abre em cima do caderno, sem sair da página; "Salvar" põe a palavra na anotação aberta */
(function(){
  var box=document.getElementById('dicbox'),bt=document.getElementById('dicbt'),dic=null;
  function abre(v){
    box.classList.toggle('on',v); bt.setAttribute('aria-expanded',String(v));
    if(!v)return;
    function fazer(){dic=UniDic.montar(document.getElementById('dicmt'),{salvar:function(l){window.UniCadernoTela.salvaLinha(l);}});dic.foca();}
    if(dic)dic.foca(); else if(window.UniDic)fazer(); else{var s=document.createElement('script');s.src='/caderno-dic.js?v=6';s.onload=fazer;document.head.appendChild(s);}
  }
  bt.onclick=function(){abre(!box.classList.contains('on'));};
  document.getElementById('dicx').onclick=function(){abre(false);bt.focus();};
  box.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Escape'){abre(false);bt.focus();}});
})();
</script>
<script>
/* Recolher: volta para a página de onde o caderno foi aberto (ou a anterior do site) e reabre o painel na mesma anotação */
document.getElementById('recolher').onclick=function(){
  var id=null,v=null;
  try{id=window.UniCadernoTela.id();window.UniCaderno&&window.UniCaderno.agora&&window.UniCaderno.agora();v=JSON.parse(sessionStorage.getItem('uni-cf-volta')||'null');}catch(e){}
  if(v&&v.u){try{sessionStorage.setItem('uni-cf-volta',JSON.stringify({u:v.u,id:id,r:1}));}catch(e){} location.href=v.u;return;}
  try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return;}}catch(e){}
  location.href='/idiomas/';
};
</script>
<script>
/* links antigos de "Caderno de palavras" (QR e #frases) agora vivem em Minhas palavras */
(function(){var q=location.search,h=location.hash;if(/[?&]w=/.test(q)||h==='#frases')location.replace('/idiomas/palavras/'+q+h)})();
</script>
</body>
