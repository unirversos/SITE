<!DOCTYPE html>
<html lang="pt-BR" data-login="obrigatorio">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca exclusiva · Unirversos</title>
<style>html[data-login="obrigatorio"]:not(.uni-ok) body>*:not(#uni-gate){visibility:hidden}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{--ink:#3a2b38;--muted:#705f6c;--line:#efe3e5;--bg:#fdf8f6;--pink:#c23f5e;--pink-d:#a8324f;--sage:#517158;--sage-s:#e8efe8;--gold:#a0712a;--gold-s:#fbf1de;--lav:#6f5fa8;--lav-s:#f3f0fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Zen Maru Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:980px;margin:0 auto;padding:28px 20px 90px}
@media(min-width:760px){.w{padding-right:70px}}
.voltar{font-size:13px;color:var(--muted);text-decoration:none}
.ey{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:16px 0 0}
h1{font-family:"Baloo 2","Zen Maru Gothic",system-ui,sans-serif;font-weight:700;font-size:clamp(26px,4vw,40px);line-height:1.2;color:#5a3d55;letter-spacing:-.01em;margin:18px 0 0}h1 em{font-style:normal;color:var(--pink)}
.bar0{height:3px;width:56px;background:var(--sage);border-radius:2px;margin:10px 0}
.sub{margin:0;color:var(--muted);max-width:44em}
.selo{display:inline-flex;gap:8px;align-items:center;background:var(--gold-s);color:#7a5418;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;margin-top:14px}
.trava{background:#fff;border:1.5px dashed #d9c6cb;border-radius:16px;padding:14px 18px;margin-top:18px}
.trava b{display:block}
section.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.sec-h b{font-family:"Baloo 2",sans-serif;font-size:22px;color:var(--pink)}.sec-h span{color:var(--muted);font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.t{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 10px 12px;text-decoration:none;color:inherit;cursor:pointer;font:inherit}
.t:hover{border-color:#d9c6cb;transform:translateY(-2px)}.t{transition:transform .15s,border-color .15s}
.t .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--c,#f4ecee)}
.t .n{font-weight:700;font-size:14.5px;line-height:1.25}.t .d{font-size:12.5px;color:var(--muted);line-height:1.3}
.t .tag{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--gold-s);color:var(--gold)}
.t.lock{opacity:.6;cursor:default}.t.lock:hover{transform:none}
.t.lock .tag{background:#f4ecee;color:var(--muted)}
.vazio{color:var(--muted);font-size:14px}
/* leitor */
.leitor{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px;margin-top:16px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:10px}
.leitor[hidden]{display:none}
.lt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.lt-bar b{flex:1;font-size:16px}
.mini{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.au-bar{display:flex;align-items:center;gap:10px;background:var(--lav-s);border-radius:12px;padding:6px 10px}.au-bar span{font-weight:700;font-size:13px;color:#5d4c97;flex:none}.au-if{flex:1;height:64px;border:0;border-radius:8px;background:#fff}
.lt-if{width:100%;height:72vh;min-height:420px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.leitor.cheia{position:fixed;inset:0;z-index:40;border-radius:0;margin:0;padding:12px 70px 12px 12px}.leitor.cheia .lt-if{height:calc(100vh - 130px)}
@media(max-width:700px){.leitor.cheia{padding-right:12px}}
.nota{font-size:14px;color:var(--muted);margin:0}
/* edição (professora) */
.ed{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;padding:16px 18px;margin-top:22px}
.ed h2{font-family:"Baloo 2",sans-serif;font-size:20px;margin:0 0 8px}
.ed form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.ed input,.ed select{font:inherit;font-size:15px;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.ed .full{grid-column:1/-1}
@media(max-width:600px){.ed form{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;padding:10px 20px;min-height:42px;cursor:pointer;background:var(--pink);color:#fff}
.ed-l{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.ed-l li{display:flex;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0;font-size:14px}.ed-l li span{flex:1}
.x{font:inherit;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.st{font-size:13px;color:var(--muted)}
.faixa-t{background:#fbf1de;color:#7a5418;font-size:13px;text-align:center;padding:6px 12px}
.sr{position:absolute;left:-9999px}
</style>
<link rel="stylesheet" href="/estilo-celular.css?v=3">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script type="module" src="/idiomas/dados/conta.js?v=6"></script>
<script>setTimeout(function(){var h=document.documentElement;if(!h.classList.contains('uni-ok')&&!document.getElementById('uni-gate'))h.classList.add('uni-ok')},10000)</script>
</head>
<body>
<div class="faixa-t">Versão de teste · Biblioteca exclusiva</div>
<div class="w">
  <a class="voltar" href="/idiomas/">← Idiomas</a>
  <h1>✦ Biblioteca <em>exclusiva</em></h1><div class="bar0"></div>
  <p class="selo" id="selo" hidden></p>
  <div id="trava"></div>
  <div id="conteudo"></div>
  <section class="leitor" id="leitor" hidden aria-live="polite"></section>
  <div id="edicao"></div>
  <p class="sub" style="margin-top:28px;font-size:13.5px">Procurando cursos grátis de outros sites? Eles estão na <a href="/idiomas/biblioteca/" style="color:var(--pink-d)">📚 Biblioteca livre</a>.</p>
</div>
<script src="/caderno-dados.js?v=8"></script>
<script type="module" src="/idiomas/teste/biblioteca-exclusiva/biblioteca-exclusiva.js?v=3"></script>
<script defer src="/caderno-flutuante.js?v=24"></script>
</body>
</html>
