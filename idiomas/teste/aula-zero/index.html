<!DOCTYPE html>
<html lang="pt-BR" data-login="obrigatorio">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">

<script type="module" src="/idiomas/dados/conta.js?v=7"></script>
<script>setTimeout(function(){var h=document.documentElement;if(!h.classList.contains('uni-ok')&&!document.getElementById('uni-gate'))h.classList.add('uni-ok')},10000)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula Zero · Unirversos Idiomas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#fdf6f4; --card:#fff; --ink:#3a2b38; --muted:#705f6c; --line:#ecdadd;
  --blush:#f8dde1; --pink:#c23f5e; --sage:#517158; --sage-soft:#e8efe8; --gold:#8e6a1f; --lavender:#b7a6dc; --sky:#cfe6f3;
  --fogo:#c23f5e; --agua:#4a7fa8; --terra:#517158; --espirito:#8a6fc4;
  --f-display:"Baloo 2","Zen Maru Gothic",system-ui,sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --r:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px;
  padding:16px max(14px,env(safe-area-inset-right)) 48px max(14px,env(safe-area-inset-left))}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--lavender);outline-offset:2px}
ruby rt{font-size:.5em;color:var(--muted);font-weight:500}
.ro{display:none;color:var(--muted);font-family:var(--f-display);font-weight:500}
body.ver-ro .ro{display:block}
body.ver-ro ruby rt.rr{display:none}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#b23a57;font-weight:700}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5.2vw,46px);line-height:1.05;margin:2px 0 0}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;min-height:44px}
.btn.small{padding:4px 12px;min-height:34px;font-size:13px}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.pri:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent}

/* as 5 chaves */
.chaves{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chave{font:inherit;color:inherit;cursor:default;display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:16px;border:2px dashed var(--line);background:var(--card);text-align:center;transition:.3s}
.chave .ico{font-size:22px;filter:grayscale(1);opacity:.35;transition:.4s}
.chave .jp{font-family:var(--f-body);font-weight:700;font-size:clamp(11px,3.3vw,15px);color:var(--muted);white-space:nowrap}
.chave small{font-size:11px;color:var(--muted);line-height:1.1}
.chave.now{border-color:var(--pink);border-style:solid}
.chave[data-i]{cursor:pointer}.chave[data-i]:hover{border-color:var(--pink)}.chave[data-i]:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.livre{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0 0;font-size:13px;color:var(--muted)}.livre button{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer}
.intro-cena{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--sage);background:var(--sage-soft);border-radius:12px;padding:8px 12px}
.chave.pop{animation:popchave .6s ease-out}
@keyframes popchave{0%{transform:scale(1)}40%{transform:scale(1.18);box-shadow:0 0 0 8px rgba(243,201,105,.45)}100%{transform:scale(1)}}
.voo{position:fixed;z-index:60;pointer-events:none;display:grid;place-items:center;font-size:22px;line-height:1;will-change:transform}
.voo-leg{position:fixed;z-index:59;left:50%;top:calc(50% + 70px);transform:translateX(-50%);pointer-events:none;text-align:center;font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--gold);background:rgba(255,255,255,.92);border:2px solid var(--gold);border-radius:999px;padding:6px 20px;white-space:nowrap}
.voo-leg small{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.chave.pop{animation:none}}
.chave.on{border:2px solid var(--gold);background:#fff9e8}
.chave.on .ico{filter:none;opacity:1}
.chave.on .jp{color:var(--gold)}

/* cena */
.scene{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
.scene{container-type:inline-size}
#placaEst{position:absolute;left:17.3%;top:12.8%;width:26.8%;height:12.9%;z-index:2;display:grid;place-content:center;justify-items:center;text-align:center;background:linear-gradient(180deg,#5b82b3,#4d74a6);border-radius:.6cqw;color:#fff;pointer-events:none;line-height:1.05;box-shadow:inset 0 0 0 .25cqw rgba(255,255,255,.35)}
#placaEst b{font-size:3.9cqw;font-weight:800;letter-spacing:.3em;margin-right:-.3em;font-family:"Zen Maru Gothic",system-ui,sans-serif}
#placaEst span{font-size:1.85cqw;font-weight:700;letter-spacing:.2em;text-shadow:0 .1cqw .3cqw rgba(0,20,60,.55)}
#placaEst i{font-size:1.85cqw;font-weight:700;font-style:normal;letter-spacing:.12em;margin-top:.1cqw;text-shadow:0 .1cqw .3cqw rgba(0,20,60,.55)}
.scene img.cena-img{display:block;width:100%;height:auto;filter:saturate(var(--sat,1));transition:filter .4s}
.scene.pb img.cena-img{filter:grayscale(1)}
@property --spr{syntax:'<length>';inherits:true;initial-value:8cqw}
.scene img.cena-cor{position:absolute;left:0;top:0;width:100%;height:100%;filter:saturate(1.1);z-index:1;pointer-events:none;
 -webkit-mask-image:radial-gradient(circle var(--spr) at var(--sx) var(--sy),#000 62%,transparent 100%);mask-image:radial-gradient(circle var(--spr) at var(--sx) var(--sy),#000 62%,transparent 100%);
 animation:spotR .9s ease-in-out infinite}
@keyframes spotR{0%,100%{--spr:calc(var(--rb)*.85);opacity:.75}50%{--spr:calc(var(--rb)*1.15);opacity:1}}
@media (prefers-reduced-motion:reduce){.scene img.cena-cor{animation:none;--spr:var(--rb)}}
#hs{position:absolute;inset:0;z-index:5;pointer-events:none}
#hs>*{pointer-events:auto}
.nav-ex{display:flex;gap:10px;margin-top:16px}
.nav-ex .btn{flex:1 1 0;min-width:0;margin:0;justify-content:center;text-align:center}
.nav-ex:has(.voltaBtn:only-child) .btn{flex:0 1 calc(50% - 5px)}
.hs{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.0);padding:0}
.hs::before{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid var(--pink);box-shadow:0 2px 6px rgba(58,43,56,.25)}
.hs::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--pink);opacity:.6;animation:ping 2.2s ease-out infinite}
.hs span{position:relative;z-index:1;font-size:15px;font-weight:800;color:var(--pink);font-family:var(--f-display)}
.hs.visto::before{border-color:var(--sage);background:var(--sage-soft)}
.hs.visto::after{animation:none;opacity:0}
.hs.visto span{color:var(--sage)}
@keyframes ping{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.hs::after{animation:none}}
.dica-cena{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.94);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted)}

/* pílula do item tocado */
.pilula{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--lavender);border-radius:16px;padding:12px 14px;display:grid;gap:2px;animation:sobe .25s ease-out}
@keyframes sobe{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.pilula .jpl{font-size:26px;font-weight:700;line-height:1.5}
.pilula .jpl b{color:var(--pink)}
.pilula .pt{margin:0}.pilula .en{margin:0;color:var(--muted);font-size:14px}
.pilula .gram{margin:6px 0 0;font-size:14px;background:var(--sage-soft);border-radius:12px;padding:8px 12px}

/* painel do passo */
.painel{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--el,var(--line));border-radius:18px;padding:18px 20px;display:grid;gap:12px}
.elem{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.elem i{width:10px;height:10px;border-radius:50%;display:inline-block}
.elem.agua{color:var(--agua)}.elem.agua i{background:var(--agua)}
.elem.fogo{color:var(--fogo)}.elem.fogo i{background:var(--fogo)}
.elem.terra{color:var(--terra)}.elem.terra i{background:var(--terra)}
.elem.ganho{color:var(--gold)}.elem.ganho i{background:var(--gold)}
.painel h2{font-family:var(--f-display);font-size:22px;line-height:1.2;margin:0}
.painel p{margin:0}
.alvo{border-left:6px solid var(--pink);background:#fff8f7;border-radius:0 16px 16px 0;padding:10px 16px;display:grid;gap:0}
.alvo .jpl{font-size:clamp(22px,6.6vw,34px);font-weight:700;line-height:1.5;word-break:keep-all;overflow-wrap:normal}
.alvo .jpl b{color:var(--pink)}
.alvo .ro{font-size:15px}
.alvo .pt{font-size:15px;color:var(--muted)}
.alvo.oculto .jpl,.alvo.oculto .ro{display:none}
.alvo.oculto::before{content:'？';font-size:34px;font-weight:700;color:var(--muted);line-height:1.5}
.acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mic{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 22px;background:var(--pink);color:#fff;font-weight:800;font-size:17px;min-height:52px}
.mic[disabled]{opacity:.55}
.mic.ouvindo{background:var(--agua)}
.sem-mic{background:none;border:0;text-decoration:underline;color:var(--muted);font-size:14px;padding:8px 4px;min-height:44px}
.escrita{display:flex;gap:8px;flex-wrap:wrap}
.escrita input{flex:1 1 200px;min-height:46px;border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;font:inherit;font-size:17px;background:#fff}
.estado{min-height:1.6em;font-weight:700}
.estado.ok{color:var(--sage)}.estado.erro{color:var(--pink)}
.ouvi{color:var(--muted);font-size:14px;min-height:1.2em}
.contagem{display:flex;gap:8px}
.contagem i{width:16px;height:16px;border-radius:50%;border:2px solid var(--terra);display:inline-block}
.contagem i.on{background:var(--terra)}
.nota{font-size:13.5px;color:var(--muted);margin:0}
.fim-bloco{text-align:center;display:grid;gap:10px;justify-items:center}
.fim-bloco .grande{font-size:46px}
.rodape{font-size:12.5px;color:var(--muted);text-align:center}
.lista-voz{background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:12px 16px;font-size:14px}
.lista-voz code{background:var(--blush);border-radius:6px;padding:0 6px}

.hs.usado{pointer-events:none}
.hs.usado::before{border-color:var(--gold);background:#fff4d6}
.hs.usado::after{animation:none;opacity:0}
.hs.usado span{color:var(--gold)}
.btn.molde{border-color:var(--gold);color:var(--gold)}
.btn.molde.pisca{animation:pisca 1.1s ease-in-out infinite;background:#fff4d6}
@keyframes pisca{50%{box-shadow:0 0 0 6px rgba(142,106,31,.25)}}
@media (prefers-reduced-motion:reduce){.btn.molde.pisca{animation:none}}
.moldebox{border-left:6px solid var(--gold);background:#fffaf0;border-radius:0 16px 16px 0;padding:10px 16px}
.moldebox .jpl{font-size:26px;font-weight:700;line-height:1.5}
.moldebox .jpl b{color:var(--pink)}
.moldebox .jpl em{font-style:normal;color:var(--muted);font-weight:500}
.rotulo-esc{margin:0;font-size:14px;font-weight:700;color:var(--agua)}
.avise{font-size:13.5px;color:var(--muted)}
.pt{display:inline-block;border-radius:8px;padding:0 3px;margin:0 1px;font-weight:800;cursor:pointer;border-bottom:3px solid currentColor;line-height:1.15;-webkit-tap-highlight-color:transparent}
.pt.o{color:#b4540a;background:#fdeedd}.pt.ni{color:#1f66ab;background:#e3f0fb}
.pt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#ptTip{position:fixed;z-index:60;max-width:260px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px rgba(58,43,56,.18);font-size:15px;line-height:1.4}
#ptTip b{font-size:22px}#ptTip.o b{color:#b4540a}#ptTip.ni b{color:#1f66ab}
.ptdica{font-size:13px;color:var(--muted);margin:6px 0 0}
.xitem{position:absolute;top:38%;transform:translate(-50%,-50%);font-size:42px;line-height:1;font-weight:900;color:#d11a3a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;pointer-events:none;z-index:2;animation:xpop .35s cubic-bezier(.3,1.6,.5,1)}
.xitem.quieto{animation:none}
@keyframes xpop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#avatarNao{position:absolute;left:2%;bottom:2%;width:23%;pointer-events:none;z-index:3}
#avatarNao svg{display:block;width:100%;height:auto}
#avatarNao .balao[hidden]{display:none}
#avatarNao .bracos{position:absolute;left:8%;right:8%;bottom:-6%;pointer-events:none}#avatarNao .bracos svg{display:block;width:100%}#avatarNao.sim .bracos{display:none}
#avatarNao .balao{position:absolute;left:62%;top:-8%;background:#fff;border:2px solid #d11a3a;color:#d11a3a;font-weight:800;font-size:13px;border-radius:12px;padding:2px 9px;white-space:nowrap}
#avatarNao .cabeca{transform-origin:50% 92%;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 8px rgba(58,43,56,.25);aspect-ratio:1}
#avatarNao.vai .cabeca{animation:nao .7s ease-in-out}
#avatarNao.vai{animation:aparece .25s ease-out}
@keyframes nao{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}35%{transform:rotate(14deg)}55%{transform:rotate(-12deg)}75%{transform:rotate(10deg)}}
@keyframes aparece{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#avatarNao.vai .cabeca,#avatarNao.vai,.xitem{animation:none}}
#avatarNao.sim .balao{border-color:#2f8f5b;color:#2f8f5b}
#avatarNao.sim.vai .cabeca{animation:sim .7s ease-in-out}
@keyframes sim{0%,100%{transform:translateY(0)}25%{transform:translateY(7px)}50%{transform:translateY(0)}75%{transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){#avatarNao.sim.vai .cabeca{animation:none}}
.placa{cursor:pointer}.placa:focus-visible rect{stroke:#8e6a1f}
#placaTip{position:fixed;z-index:60;max-width:270px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px rgba(58,43,56,.18);font-size:15px;line-height:1.4}
#placaTip b{color:var(--pink)}
.qz-bt{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.qz-bt .btn{min-width:30%}
.qz-bt .btn small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.verbo b{color:var(--pink)}
/* barra do site, migalha e rodapé iguais aos da trilha */
.sitebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 18px}
.logo{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.14em;text-decoration:none;color:inherit}
.logo span{color:var(--pink)}
.navlinks{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;font-size:14px}
.navlinks a{text-decoration:none;color:var(--muted)}
.navlinks a:hover,.navlinks a[aria-current]{color:var(--pink)}
.voltar{justify-self:start;display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;min-height:40px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink)}
.voltar:hover{border-color:var(--pink);color:var(--pink)}
.fecho-lista{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;width:100%;max-width:520px;text-align:left}
.fecho-lista li{background:#fffaf0;border-left:5px solid var(--gold);border-radius:0 14px 14px 0;padding:8px 14px;display:grid;gap:0}
.fecho-lista .jpl{font-size:22px;font-weight:700;line-height:1.4}
.fecho-lista small{color:var(--muted)}
.voce-disse{margin:0;background:#fffaf0;border-left:5px solid var(--gold);border-radius:0 14px 14px 0;padding:8px 16px;text-align:left;justify-self:stretch}
.voce-disse .jpl{font-size:24px;font-weight:700;line-height:1.4;display:block}
.voce-disse small{color:var(--muted)}
.dia{max-width:46ch;margin:0}
footer.rodape-site{border-top:1.5px dashed var(--line);padding-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;font-size:14px;color:var(--muted)}
footer.rodape-site a{color:var(--ink);text-decoration:none}
/* cor do elemento vira só a borda lateral do cartão, como na trilha */
.painel{--el:var(--line)}
body[data-etapa="agua"] .painel{--el:var(--agua)}
body[data-etapa="fogo"] .painel{--el:var(--fogo)}
body[data-etapa="terra"] .painel{--el:var(--terra)}
body[data-etapa="ar"] .painel{--el:var(--gold)}
.ro-svg{display:none}body.ver-ro .ro-svg{display:inline}
.ro-bar{display:none;font-size:10px;color:var(--muted);line-height:1}body.ver-ro .ro-bar{display:block}
.ro-in{display:none;color:var(--muted);font-weight:500;font-size:.85em}body.ver-ro .ro-in{display:inline}
.scene.pb svg{filter:grayscale(1) contrast(1.05);transition:filter .4s}
.scene svg{transition:filter .4s}
.scene #avatarNao.apresenta{width:30%;left:3%;bottom:3%;animation:piscaFace .9s ease-in-out infinite;border-radius:50%}
#avatarNao.apresenta .balao{left:70%;top:0;border-color:var(--terra);color:var(--terra);font-size:16px}
.scene{position:relative}
#ganhoCena{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:6;display:grid;justify-items:center;gap:6px;pointer-events:none;animation:ganhoIn .7s cubic-bezier(.2,1.4,.4,1) both}
#ganhoCena .gc-key{width:clamp(90px,22%,150px);aspect-ratio:1;filter:drop-shadow(0 0 18px rgba(232,168,32,.8))}
#ganhoCena .gc-t{background:rgba(255,255,255,.92);border:2px solid #e8a820;border-radius:14px;padding:6px 16px;font-size:clamp(20px,4vw,30px);font-weight:800;text-align:center;color:#3a2b38}
#ganhoCena .gc-t small{display:block;font-size:12px;font-weight:600;color:#8a6a1c;letter-spacing:.08em;text-transform:uppercase}
@keyframes ganhoIn{from{opacity:0;transform:translate(-50%,-30%) scale(.5)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){#ganhoCena{animation:none}}
.nome-card{display:flex;align-items:center;gap:14px;justify-content:center;margin:10px auto;padding:12px 18px;max-width:340px;border:2px solid var(--terra);border-radius:18px;background:#fff;animation:puxa .6s ease-out}
.nc-av{width:84px;height:84px;border-radius:50%;overflow:hidden;animation:piscaFace .9s ease-in-out infinite}
.nc-av svg{width:100%;height:100%;display:block}
.nc-t{font-size:22px;font-weight:700}.nc-t span{color:var(--muted);margin-left:4px;font-weight:500}
@keyframes puxa{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes piscaFace{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(194,63,94,0)}50%{transform:scale(1.08);box-shadow:0 0 0 10px rgba(194,63,94,.3)}}

#clAv .cl-perna.e{left:16%}#clAv .cl-perna.d{right:16%}

/* magia ao tocar: anel, faíscas e clarão final */
.fx{position:absolute;pointer-events:none;width:0;height:0;z-index:6}
.fx .anel{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid #ffe08a;box-shadow:0 0 14px 4px rgba(255,214,102,.8);animation:fxanel .9s ease-out forwards}
.fx .fa{position:absolute;left:-7px;top:-9px;font-size:16px;line-height:1;color:#ffd24d;text-shadow:0 0 8px #fff4c2,0 0 14px #ffb300;animation:fxfaisca var(--d,.9s) cubic-bezier(.15,.7,.3,1) forwards;opacity:0}
@keyframes fxanel{0%{transform:scale(.3);opacity:1}100%{transform:scale(3.4);opacity:0}}
@keyframes fxfaisca{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg);opacity:0}}
.scene.clarao::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle at 50% 50%,rgba(255,244,200,.85),rgba(255,230,150,0) 70%);animation:fxclarao 1.4s ease-out forwards}
@keyframes fxclarao{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.contagem i{transition:transform .25s,background .25s}.contagem i.on{animation:bolinha .5s ease-out}
@keyframes bolinha{0%{transform:scale(.4)}60%{transform:scale(1.7);box-shadow:0 0 10px 3px #ffd24d}100%{transform:scale(1)}}
#abreEx.libera{animation:libera 1.2s ease-in-out 3}
@keyframes libera{0%,100%{box-shadow:4px 4px 0 var(--tinta)}50%{box-shadow:0 0 0 4px #ffe08a,0 0 22px 6px #ffd24d}}
@media (prefers-reduced-motion:reduce){.fx,.scene.clarao::after,#abreEx.libera,.contagem i.on{animation:none}}
[data-luz]{opacity:.5;transition:opacity .9s ease}
[data-luz].on{opacity:1}
[data-luz].luz-pisca{animation:luzpisca 1.3s ease-out}
@keyframes luzpisca{0%{opacity:.5}25%{opacity:1}40%{opacity:.6}60%,100%{opacity:1}}
.fundo{transition:opacity .9s}
@media (prefers-reduced-motion:reduce){[data-luz]{transition:none}[data-luz].luz-pisca{animation:none}}

const vogalDe=c=>{for(const v in VOG)if(VOG[v].includes(c))return {a:'あ',i:'い',u:'う',e:'え',o:'お'}[v];return '';};
const kata2hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));

  let t=kata2hira(String(s||'').normalize('NFKC').toLowerCase()).replace(/[\s、。，．,.!！?？…・「」『』（）()~〜\-_'"“”]/g,'').replace(/を/g,'お');

};

function dist(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}

const PREF=['','これは','いいえ','はい','すみません'].map(norm);

function confere(texto,ans,fala){
  const t=norm(texto);if(!t)return false;

  const t=norm(texto),key=g[g.length-1];

function ttsJa(t,rate,fim){
  try{
    if(!window.speechSynthesis){if(fim)fim();return;}

    const v=speechSynthesis.getVoices().find(x=>/^ja/i.test(x.lang));if(v)u.voice=v;
    let acabou=false;const termina=()=>{if(acabou)return;acabou=true;if(fim)fim();};

    /* cancel() seguido de speak() imediato pode engolir a fala; espera um instante e destrava a fila */
    setTimeout(()=>{try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){termina();}},60);
    setTimeout(termina,Math.max(2500,t.length*450));
  }catch(e){if(fim)fim();}
}

  const id=(window.AUDIO_MAP||{})[chaveAudio(t)];

}
function fala(t){
  try{if(audioAtual){audioAtual.pause();audioAtual=null;}if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}

  if(partes.length<2){tocaUma(t);return;}
  let i=0;const prox=()=>{if(i<partes.length)tocaUma(partes[i++],prox);};prox();
}

if(LIVRE){
  /* navegar é livre (ver qualquer chave, acesa ou apagada); acender continua exigindo a resposta do aluno */
  const primeiraApagada=()=>{const i=CHAVES.findIndex(c=>!S.acesas.includes(c.n));return i<0?0:i;};
  S.primeiraApagada=primeiraApagada;
  barra.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;S.k=+b.dataset.i;vai('agua');});
  const lv=document.createElement('div');lv.className='livre';
  lv.innerHTML='<button type="button" id="lvAnt">‹ Chave anterior</button><button type="button" id="lvProx">Próxima chave ›</button>';
  barra.insertAdjacentElement('afterend',lv);
  const anda=d=>{
    if(S.passo==='chegada'){if(d>0){S.k=primeiraApagada();vai('agua');}return;}
    if(S.passo==='fim')return;
    if(S.passo==='prontas'){if(d<0){S.k=CHAVES.length-1;vai('agua');}else{S.f=0;vai('final');}return;}
    if(S.passo==='final'){if(d<0){S.p=0;vai('prontas');}return;}
    const k=S.k+d;
    if(k<0){vai('chegada');return;}
    if(k>=CHAVES.length){S.p=0;vai('prontas');return;}
    S.k=k;vai('agua');
  };
  $('lvAnt').onclick=()=>anda(-1);$('lvProx').onclick=()=>anda(1);
}
function vai(passo){if(passo!=='terra')S.t1=null;if(passo==='agua'&&S.passo!=='agua')S.ai=(S.__ai!=null?S.__ai:0);S.__ai=null;if(S.__paraClipe){S.__paraClipe();S.__paraClipe=null;}if(passo!=='clipe'&&S.passo==='clipe')S.clipeVisto=true;S.passo=passo;S.erros=0;S.feitos=[];pararMic();pilula.hidden=true;render();}
function render(){
  render0();
  const ok=['agua','fixa','falafix','fogo','terra'].includes(S.passo);
  if(ok&&painel&&!painel.querySelector('.voltaBtn')){
    const nav=document.createElement('div');nav.className='nav-ex';
    const v=document.createElement('button');v.type='button';v.className='btn ghost voltaBtn';v.textContent='← Voltar';v.setAttribute('aria-label','Voltar ao exercício anterior');v.onclick=voltaPasso;nav.appendChild(v);
    const pu=[...painel.querySelectorAll('button.btn.ghost')].find(b=>/^Pular/.test(b.textContent.trim()));
    if(pu){const rot=pu.textContent.trim();pu.setAttribute('aria-label',rot.replace(/→/,'').trim());pu.textContent='Pular →';nav.appendChild(pu);}
    painel.appendChild(nav);
  }
}
function voltaPasso(){
  const p=S.passo;try{pararMic();}catch(e){}
  if(p==='agua'){ if((S.ai||0)>0){S.ai--;vai('agua');} else vai('toque'); }
  else if(p==='fixa'){ S.__ai=Math.max(0,CHAVES[S.k].hot.length-1); vai('agua'); }
  else if(p==='falafix'){ vai('fixa'); }
  else if(p==='fogo'){ S.ff=0; vai('falafix'); }
  else if(p==='terra'){ vai('fogo'); }
  window.scrollTo(0,0);
}
function render0(){
  { const gc=document.getElementById('ganhoCena'); if(gc) gc.remove(); }
  window.__render=render;
  if(S.passo==='retoma'&&S.k<1)S.passo='agua';
  if(S.passo==='agua'&&!toqueCompleto(CHAVES[S.k])&&!S.toqueOk[S.k])S.passo='toque';
  if(S.passo==='agua'&&CHAVES[S.k].n===3&&!S.clipeVisto){S.passo='clipe';S.cl=0;}
  desenhaBarra();desenhaHot();
  luzCena();luzToque();
  { const pr=S.passo==='prontas'?((PRONTAS[S.p||0]||{}).fogo?'fogo':'agua'):null;
    const et={toque:'agua',agua:'agua',fogo:'fogo',clipe:'agua',terra:'terra',quiz:'terra',fixa:'fogo',falafix:'fogo',ganho:'ar',retoma:'fogo'}[S.passo];
    document.body.dataset.etapa=pr||et||''; }
  const c=CHAVES[S.k];
  if(S.passo==='toque')return telaToque(c);
  if(S.passo==='retoma')return telaRetoma();
  if(S.passo==='clipe')return telaClipe(c);
  if(S.passo==='chegada')return telaChegada();
  if(S.passo==='fim')return telaFim();
  if(S.passo==='agua')return telaAgua(c);
  if(S.passo==='fogo')return telaResposta(c,'fogo','Fogo · a fechadura',c.fogo.pedido,c.fogo);
  if(S.passo==='terra')return telaTerra(c);
  if(S.passo==='quiz')return telaQuiz(c);
  if(S.passo==='fixa')return telaFixa(c);
  if(S.passo==='falafix')return telaFalaFix(c);
  if(S.passo==='ganho')return telaGanho(c);
  if(S.passo==='prontas')return telaProntas();
  if(S.passo==='final')return telaFinal();
}
/* retomada: antes de abrir a chave nova, a pessoa refaz de memória a anterior */
function telaRetoma(){
  const prev=CHAVES[S.k-1];
  S.retomado[S.k]=true;
  const c={n:prev.n,rotulo:'Antes da chave '+String(CHAVES[S.k].n).padStart(2,'0')+' · lembra da chave '+String(prev.n).padStart(2,'0')+' ('+prev.jp+')?',molde:prev.molde,moldeRo:prev.moldeRo,jp:prev.jp};
  const alvo=Object.assign({},prev.fogo,{depois:()=>vai('agua')});
  telaResposta(c,'fogo','',prev.fogo.pedido,alvo);
}

/* cada círculo tocado acende, em cor, o objeto que está embaixo dele (mesmo antes da chave inteira acender) */
function luzToque(novo){
  const NS='http://www.w3.org/2000/svg';
  ['svgEst','svgKon'].forEach(id=>{
    const svg=$(id);if(!svg)return;
    const grupos=[...svg.querySelectorAll('[data-luz]:not(.luz-clone)')];if(!grupos.length)return;
    let cor=svg.querySelector('.luz-cor'),mk;
    if(!cor){
      const defs=document.createElementNS(NS,'defs');
      defs.innerHTML='<filter id="bl-'+id+'" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter><mask id="mk-'+id+'" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="250"><g class="mk-spots" filter="url(#bl-'+id+')"></g></mask>';
      svg.insertBefore(defs,svg.firstChild);
      cor=document.createElementNS(NS,'g');cor.setAttribute('class','luz-cor');cor.setAttribute('mask','url(#mk-'+id+')');cor.setAttribute('pointer-events','none');
      grupos.forEach(g=>{const c=g.cloneNode(true);c.removeAttribute('data-luz');c.removeAttribute('filter');c.classList.remove('on','luz-pisca');c.classList.add('luz-clone');c.style.opacity='1';c.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));cor.appendChild(c);});
      grupos[grupos.length-1].insertAdjacentElement('afterend',cor);
    }
    mk=svg.querySelector('.mk-spots');
    const kon=id==='svgKon';let h='';
    CHAVES.forEach(c=>{if((c.n>=4)!==kon)return;c.hot.forEach((o,i)=>{if(S.visto.has(c.n+'-'+i))h+='<circle cx="'+(o.x*4)+'" cy="'+(o.y*2.5)+'" r="'+(novo===c.n+'-'+i?0:38)+'" fill="#fff">'+(novo===c.n+'-'+i?'<animate attributeName="r" from="0" to="38" dur=".9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .3 1"/>':'')+'</circle>';});});
    mk.innerHTML=h;
  });
}
/* acende os objetos da cena que pertencem às chaves já acesas; o fundo ganha cor aos poucos */
function luzCena(novo){
  const n=Math.min(S.acesas.length,5);
  { const im=document.getElementById('imgEst'); if(im) im.style.setProperty('--sat',1); }
  document.querySelectorAll('.fundo').forEach(g=>{if(n>=5)g.removeAttribute('filter');else g.setAttribute('filter','url(#sat'+n+')');});
  document.querySelectorAll('[data-luz]').forEach(g=>{
    const k=+g.dataset.luz,on=S.acesas.includes(k);
    g.classList.toggle('on',on);
    if(on)g.removeAttribute('filter');else g.setAttribute('filter','url(#cinza)');
    if(novo===k&&on){g.classList.add('luz-pisca');setTimeout(()=>g.classList.remove('luz-pisca'),1400);}
  });
}


function magia(h){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const f=document.createElement('span');f.className='fx';f.style.left=h.x+'%';f.style.top=h.y+'%';
  let t='<i class="anel"></i>';
  for(let i=0;i<9;i++){const a=(i/9)*6.283+Math.random()*.6,d=26+Math.random()*30;t+='<i class="fa" style="--dx:'+Math.round(Math.cos(a)*d)+'px;--dy:'+Math.round(Math.sin(a)*d)+'px;--d:'+(.7+Math.random()*.5).toFixed(2)+'s">✦</i>';}
  f.innerHTML=t;hsBox.appendChild(f);setTimeout(()=>f.remove(),1500);
}

/* Água: ouvir e repetir TODAS as frases que acabaram de ser tocadas na cena, uma por vez; depois vem o "toque na palavra" */
function telaAgua(c){
  const M=c.hot.length;
  if(S.aiK!==S.k){S.ai=0;S.aiK=S.k;}
  const i=Math.min(S.ai||0,M-1),h=c.hot[i];
  const alvo={say:h.say,t:h.t,ro:h.ro,pt:h.pt,g:[[h.say]],diag:()=>'Quase. Toque em 🔊 Ouvir e repita a frase inteira.',
    depois:()=>{if(i+1<M){S.ai=i+1;vai('agua');}else{S.ai=0;vai('fixa');}}};
  const cc=Object.assign({},c,{intro:i===0?c.intro:undefined});
  telaResposta(cc,'agua','Água · ouvir e repetir · '+(i+1)+' de '+M,'Ouça e repita em voz alta.',alvo);
  const h2=painel.querySelector('h2');
  if(h2)h2.insertAdjacentHTML('afterend','<div class="contagem" aria-label="'+(i+1)+' de '+M+'">'+c.hot.map((_,j)=>'<i class="'+(j<i?'on':'')+'"></i>').join('')+'</div>');
  const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent='Pular a repetição →';
  b.onclick=()=>{pararMic();S.ai=0;vai('fixa');};painel.appendChild(b);
}
/* fase 0 de cada chave: tocar e ouvir todos os círculos da cena; só então abre o exercício */
function toqueCompleto(c){return S.acesas.includes(c.n)||c.hot.every((h,i)=>S.visto.has(c.n+'-'+i));}
function telaToque(c){
  const M=c.hot.length;
  painel.innerHTML=`<span class="elem agua"><i></i>Chave ${String(c.n).padStart(2,'0')} · Toque e ouça</span>
   <h2>Toque em cada círculo da cena e ouça.</h2>
   <p>Cada um que você toca acende a cena. Quando todos estiverem acesos, o exercício abre.</p>
   <div class="contagem" id="ctg"></div><p class="gram" id="ctgTxt"></p>
   <div class="acoes"><button class="btn pri" type="button" id="abreEx" disabled>Abrir o exercício →</button></div>`;
  $('abreEx').onclick=()=>{S.toqueOk[S.k]=true;vai('agua');};
  atualizaToque();
}
function atualizaToque(novo){
  const c=CHAVES[S.k],M=c.hot.length,n=c.hot.filter((h,i)=>S.visto.has(c.n+'-'+i)).length;
  const ctg=$('ctg');if(!ctg)return;
  ctg.setAttribute('aria-label',n+' de '+M);

function voaChave(c,fim){
  const slot=barra.children[S.k]&&barra.children[S.k].querySelector('.ico');

  if(!slot||reduz||!Element.prototype.animate){fim();return {cancela(){}};}
  window.scrollTo(0,0);
  const r=slot.getBoundingClientRect();
  const el=document.createElement('div');el.className='voo';el.setAttribute('aria-hidden','true');el.textContent=c.ico;
  el.style.left=r.left+'px';el.style.top=r.top+'px';el.style.width=r.width+'px';el.style.height=r.height+'px';
  const leg=document.createElement('div');leg.className='voo-leg';leg.setAttribute('aria-hidden','true');

    {transform:`translate(${dx}px,${dy}px) scale(.2)`,opacity:0,offset:0},

}

/* ---------- reconhecimento de voz com diagnóstico (não fica parado em silêncio) ---------- */
function msgMic(cod){
  if(/not-allowed|service-not-allowed/.test(cod))return 'O navegador bloqueou o microfone. Libere nas permissões do site (ícone de cadeado ao lado do endereço) e tente de novo.';
  if(/audio-capture/.test(cod))return 'Não achei nenhum microfone neste aparelho.';
  if(/network/.test(cod))return 'O reconhecimento de voz do navegador precisa de internet e não conseguiu conectar. Tente no Chrome ou digite.';
  if(cod==='sem-audio')return 'O navegador não conseguiu abrir o microfone. É comum no Edge e no Brave. Tente no Chrome ou digite.';
  if(cod==='sem-voz'||cod==='no-speech')return 'Não ouvi voz. Confira se o microfone certo está selecionado no aparelho e fale mais perto.';
  if(cod==='sem-resultado')return 'Ouvi você, mas o navegador não devolveu o texto. O reconhecimento de voz dele pode não estar funcionando. Tente no Chrome ou digite.';
  if(cod==='nomatch')return 'Não entendi o que foi dito. Tente de novo.';
  return 'Não consegui usar o microfone ('+(cod||'erro')+').';
}
/* falhas do ambiente (não são erro da pessoa): abrem o teclado na hora */
const falhaDeAmbiente=cod=>/not-allowed|service-not-allowed|audio-capture|network|sem-audio|sem-resultado/.test(cod);
function escutar(h){
  pararMic();
  const r=new SR();rec=r;r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
  let fase='inicio',t1=null,fechado=false;
  const limpa=()=>{clearTimeout(t1);fechado=true;};
  const arma=(ms,cod)=>{clearTimeout(t1);t1=setTimeout(()=>{if(fechado)return;limpa();try{r.abort();}catch(e){}h.falha(cod);},ms);};
  r.onstart=()=>{fase='inicio';h.estado('🎤 Abrindo o microfone…');arma(7000,'sem-audio');};
  r.onaudiostart=()=>{fase='audio';h.estado('🎧 Pode falar…');arma(8000,'sem-voz');};
  r.onspeechstart=()=>{fase='voz';h.estado('🎧 Estou ouvindo…');arma(12000,'sem-resultado');};
  r.onspeechend=()=>{fase='proc';h.estado('⏳ Entendendo…');arma(6000,'sem-resultado');};
  r.onresult=ev=>{if(fechado)return;limpa();const alts=[];for(let i=0;i<ev.results[0].length;i++)alts.push(ev.results[0][i].transcript);h.resultado(alts);};
  r.onnomatch=()=>{if(fechado)return;limpa();h.falha('nomatch');};
  r.onerror=ev=>{if(fechado)return;limpa();const e=(ev&&ev.error)||'erro';if(e==='aborted')return;h.falha(e);};
  r.onend=()=>{if(fechado)return;limpa();h.falha(fase==='audio'?'sem-voz':(fase==='voz'||fase==='proc')?'sem-resultado':'sem-audio');};
  h.estado('🎤 Abrindo o microfone…');
  try{r.start();arma(7000,'sem-audio');}catch(e){limpa();h.falha('erro');}
  return {parar:()=>{try{r.stop();}catch(e){}}};
}

/* ---------- entrada do aluno: microfone primeiro, teclado como reforço ---------- */
function montaEntrada(c,trata){
  const ac=$('acoes'),est=$('estado'),ouvi=$('ouvi'),esc=$('escrita'),ref=$('reforco');
  const usaMic=SR&&!S.semMic&&!S.micNegado;

    const inp=$('inp');
    const envia=()=>{const v=inp.value.trim();if(!v)return;inp.value='';trata([romaji2kana(v),v],'texto');};
    $('env').onclick=envia;inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();envia();}});
    if(!usaMic)inp.focus({preventScroll:true});
  }
  const E={
    falha(dito,msg){S.erros++;painel.querySelectorAll('.ouvir-alvo[hidden]').forEach(b=>b.hidden=false);est.className='estado erro';est.textContent=msg;ouvi.textContent=dito?'Ouvi: “'+dito+'”':'';reforco();},
    aviso(msg,dito){est.className='estado erro';est.textContent=msg;ouvi.textContent=dito?'Você escreveu: “'+dito+'”':'';},
    ok(dito,msg){pararMic();est.className='estado ok';est.textContent=msg||'✓ Isso!';ouvi.textContent=dito?'Você disse: '+dito:'';ac.innerHTML='';esc.innerHTML='';ref.innerHTML='';}
  };
  function reforco(){
    if(S.erros>=2)escrita(usaMic?'O mic não pegou? Digite aqui para acender sua chave:':'Digite aqui para acender sua chave:');
    if(S.erros>=3&&!$('btnMolde')){
      const b=document.createElement('button');b.type='button';b.id='btnMolde';b.className='btn molde pisca';b.textContent='ver molde';
      b.onclick=()=>{b.classList.remove('pisca');ref.querySelector('.moldebox')?.remove();const d=document.createElement('div');d.className='moldebox';
        d.innerHTML=`<div class="jpl" lang="ja">${c.molde}</div><div class="ro">${c.moldeRo}</div>`;ref.appendChild(d);};

  }
  let sessao=null;
  function ouvir(){
    if(sessao){sessao.parar();return;}
    try{speechSynthesis.cancel();if(audioAtual)audioAtual.pause();}catch(e){}
    const volta=()=>{sessao=null;micBtn.classList.remove('ouvindo');micBtn.innerHTML='🎤 Falar';};
    micBtn.classList.add('ouvindo');micBtn.innerHTML='⏹ Parar e enviar';
    sessao=escutar({
      estado:m=>{est.className='estado';est.textContent=m;},
      resultado:alts=>{volta();trata(alts,'voz');},
      falha:cod=>{volta();
        if(falhaDeAmbiente(cod)){if(/not-allowed|service-not-allowed/.test(cod))S.micNegado=true;est.className='estado erro';est.textContent=msgMic(cod)+' Digite a resposta.';ouvi.textContent='';escrita('Digite aqui para acender sua chave:');}
        else E.falha('',msgMic(cod));}
    });
  }
  if(usaMic){
    if(c._ouvirAlvo){const ob=document.createElement('button');ob.type='button';ob.className='btn ouvir-alvo';ob.textContent='🔊 Ouvir';ob.onclick=c._ouvirAlvo;if(c._esconde&&S.erros<1)ob.hidden=true;ac.appendChild(ob);}
    micBtn=document.createElement('button');micBtn.type='button';micBtn.className='mic';micBtn.innerHTML='🎤 Falar';micBtn.onclick=ouvir;ac.appendChild(micBtn);
    const sm=document.createElement('button');sm.type='button';sm.className='sem-mic';sm.textContent='Não tenho microfone';
    sm.onclick=()=>{S.semMic=true;try{localStorage.setItem('uniNovaSemMic','1');}catch(e){}pararMic();render();};ac.appendChild(sm);
  }else{
    if(c._ouvirAlvo){const ob=document.createElement('button');ob.type='button';ob.className='btn ouvir-alvo';ob.textContent='🔊 Ouvir';ob.onclick=c._ouvirAlvo;if(c._esconde&&S.erros<1)ob.hidden=true;ac.appendChild(ob);}
    if(SR){const volta=document.createElement('button');volta.type='button';volta.className='sem-mic';volta.textContent='Usar microfone';
      volta.onclick=()=>{S.semMic=false;S.micNegado=false;try{localStorage.setItem('uniNovaSemMic','0');}catch(e){}render();};ac.appendChild(volta);}
    else est.textContent='Seu navegador não escuta o microfone. Escreva a resposta.';
    escrita('Digite aqui para acender sua chave:');
  }
  if(S.erros>=2)escrita(usaMic?'O mic não pegou? Digite aqui para acender sua chave:':'Digite aqui para acender sua chave:');
  return E;
}

/* chaves 02–05: todas as coisas da cena piscam, uma por vez, em ordem aleatória; a pessoa diz a frase de cada uma */

  let alvoPisca=null,faseNome=false,totalRod=0;
  if(c.n===1){
    if(!S.t1){ const ix=c.hot.map((_,i)=>i); for(let i=ix.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ix[i],ix[j]]=[ix[j],ix[i]];} S.t1={ordem:ix,i:0}; }
    totalRod=S.t1.ordem.length;
    if(S.t1.i>=totalRod){ faseNome=true; hsBox.innerHTML=''; }
    else { const e=S.t1.ordem[S.t1.i]; alvoPisca=c.hot[e]; const bt=hsBox.children[e]; if(bt) bt.classList.add('pisca'); luzAlvo(alvoPisca,null); }
  }
  painel.innerHTML=`<span class="elem terra"><i></i>Chave ${String(c.n).padStart(2,'0')} · Terra · gravar</span>
   <h2>${faseNome?'Agora é a sua vez: apresente-se. Diga seu nome com です.':alvoPisca?'Uma coisa da cena está piscando. Diga o que é, com です.':t.pedido}</h2>
   ${c.n===1?`<div class="contagem" id="cont" aria-label="${S.t1.i} de ${totalRod+1}">${Array.from({length:totalRod+1},(_,i)=>`<i class="${i<S.t1.i?'on':''}"></i>`).join('')}</div>`:`<div class="contagem" id="cont" aria-label="${feitos} de 1">${[0].map(i=>`<i class="${i<feitos?'on':''}"></i>`).join('')}</div>`}

   <div class="moldebox"><div class="jpl" lang="ja">${c.molde}</div><div class="ro">${c.moldeRo}</div></div>
   ${c.n===3?'<p class="ptdica">👆 Toque no <span class="pt o">を</span> ou no <span class="pt ni">に</span> para ver a diferença.</p>':''}
   <div class="acoes" id="acoes"></div><div class="estado" id="estado"></div><div class="ouvi" id="ouvi"></div>
   <div id="escrita"></div><div id="reforco" class="acoes" style="flex-direction:column;align-items:flex-start"></div>`;
  if(faseNome){ try{ const av=$('avatarNao'); if(av){ const A=window.UtopiaAvatar,a=A&&A.load(),pf=(a&&a.profile)||{}; const cab=av.querySelector('.cabeca'); const sel=(a&&a.sel)||(A&&A.DEFAULT); if(A&&sel&&cab) cab.innerHTML=A.svg(sel,{viewBox:'40 46 160 160',still:true,label:'Seu avatar'}); const bl=av.querySelector('.balao'); bl.textContent=((pf.kata||pf.name||'').trim()||'？？？')+'です'; bl.hidden=false; av.querySelector('.bracos').innerHTML=''; av.classList.remove('sim','vai'); av.classList.add('apresenta'); av.hidden=false; } }catch(e){} }
  const JA=/^[぀-ゟ゠-ヿ一-鿿]+$/;
  /* sufixos aceitos (do mais longo para o mais curto); cada um pode pedir um tipo de palavra */
  const sufs=[];
  const add=(lista)=>lista.forEach(x=>sufs.push(norm(x)));
  const sufTipo=new Map();
  if(t.tipos){t.tipos.forEach(tp=>tp.s.forEach(x=>{const n0=norm(x);[n0,'は'+n0,'わ'+n0].forEach(y=>{sufs.push(y);sufTipo.set(y,tp.id);});}));}
  else add(t.suf._);
  sufs.sort((a,b)=>b.length-a.length);
  let ultimoTipo=null;
  const canon=w=>{for(const id in ITEM){if(ITEM[id].some(a=>norm(a)===w))return id;}return w;};
  function palavraDe(txt){
    const n=norm(txt);if(!n)return null;
    for(const sf of sufs){
      if(!n.endsWith(sf))continue;
      let rest=n.slice(0,n.length-sf.length);
      for(const p of PREF){if(p&&rest.startsWith(p)&&rest.length>p.length){rest=rest.slice(p.length);break;}}
      if(rest&&JA.test(rest)&&!sufs.includes(rest)&&rest!=='です'&&rest!=='ます'){ultimoTipo=sufTipo.get(sf)||null;return rest;}
    }
    return null;
  }
  const E=montaEntrada(c,(textos)=>{
    const dito=textos[0]||'';
    if(c.n===3){
      /* chave 03: a partícula tem que combinar com o verbo (を: たべ/のみ/かい; に: いき/のり) */
      const WO=['たべ','食べ','のみ','飲み','かい','買い'],NI=['いき','行き','のり','乗り'];
      let msg=null;
      for(const x of textos){
        let n=norm(x);for(const p of PREF){if(p&&n.startsWith(p)&&n.length>p.length){n=n.slice(p.length);break;}}
        const st=[...WO,...NI].find(v=>n.endsWith(v+'ます'));
        if(!st){if(!msg)msg=n.endsWith('ます')?'Use um verbo da cena: たべ, のみ, かい, いき ou のり.':null;continue;}
        const par=WO.includes(st)?'を':'に',outra=par==='を'?'に':'を';
        const rest=n.slice(0,n.length-st.length-2);
        if(!rest){msg='Falta a coisa ou o lugar antes do '+st+'ます.';continue;}
        if(!rest.endsWith(norm(par))||rest.length<=1){msg=rest.endsWith(norm(outra))?'Com '+st+'ます use '+par+', não '+outra+'. Faltou o '+par+' antes do '+st+'ます.':'Faltou o '+par+' antes do '+st+'ます.';continue;}
        const id=rest+'|'+st;
        if(S.feitos.includes(id)){E.aviso('Essa frase você já usou. Escolha outra.',dito);return;}
        S.feitos.push(id);S.ditas[c.n]=x;E.ok(x,'✓ Boa!');
        if(S.feitos.length>=1){setTimeout(()=>{S.conquista=true;vai(c.n===3?'quiz':'ganho');},1200);}else setTimeout(()=>telaTerra(c),1100);
        return;
      }
      E.falha(dito,msg||'Escreva uma frase inteira e feche com ます.');return;
    }
    for(const x of textos){const w=palavraDe(x);if(w){
      if(alvoPisca&&canon(w)!==alvoPisca.item){ E.falha(dito,'A que está piscando é outra. Toque no ♪ que pisca para ouvir a palavra.'); return; }
      const id=t.tipos?ultimoTipo:canon(w);
      if(c.n!==1&&S.feitos.includes(id)){E.aviso(t.tipos?'Essa palavra de pergunta você já usou. Use outra: どこ, なん ou なんじ.':'Essa palavra você já usou. Escolha outra.',dito);return;}
      if(c.n===1){
        S.ditas[c.n]=x; E.ok(x,faseNome?'✓ Prazer em conhecer!':'✓ Boa!');
        if(faseNome){ S.t1=null; setTimeout(()=>{S.conquista=true;vai('ganho');},1500); }
        else { plim(true); S.t1.i++; setTimeout(()=>telaTerra(c),1200); }
        return;
      }
      S.feitos.push(id);S.ditas[c.n]=x;E.ok(x,'✓ Boa!');
      if(S.feitos.length>=1){setTimeout(()=>{S.conquista=true;vai(c.n===3?'quiz':'ganho');},1200);}else setTimeout(()=>telaTerra(c),1100);
      return;}}
    const n=norm(dito);
    let msg='Escreva uma palavra em kana ou romaji e feche com '+t.key+'.';
    if(sufs.some(sf=>n.endsWith(sf))){msg='Falta uma palavra antes do '+t.key+'.';}
    else if(c.n===5&&(n==='ください'||n==='下さい')){msg='Falta uma palavra e o を antes do ください.';}
    else if(c.n===5&&n.endsWith('ください')&&!/お(ください|下さい)$/.test(n)){msg='Faltou o を antes do ください.';}
    else if(n.length>1){msg='Faltou o '+t.key+' no final.';}
    E.falha(dito,msg);
  });
}

<script>
/* を / に coloridos e clicáveis em toda a página */
(function(){
  const VERBO=/^(いき|のり|行き|乗り)/;
  const tip=document.createElement('div');tip.id='ptTip';tip.hidden=true;document.body.appendChild(tip);
  const TXT={o:'<b>を</b> liga a <b>coisa</b>: o que você come, bebe, compra ou pede.<br><small>おにぎり<b>を</b>たべます</small>',
             ni:'<b>に</b> liga o <b>lugar</b>: para onde você vai.<br><small>とうきょう<b>に</b>いきます</small>'};
  function abre(el){const k=el.classList.contains('o')?'o':'ni';tip.className=k;tip.innerHTML=TXT[k];tip.hidden=false;
    const r=el.getBoundingClientRect();const w=Math.min(260,innerWidth-16);
    tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';
    const top=r.bottom+10;tip.style.top=(top+tip.offsetHeight>innerHeight?Math.max(8,r.top-tip.offsetHeight-10):top)+'px';}
  document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('span.pt');
    if(el){e.stopPropagation();e.preventDefault();if(!tip.hidden&&tip._el===el){tip.hidden=true;tip._el=null;}else{tip._el=el;abre(el);}}
    else if(!tip.hidden){tip.hidden=true;tip._el=null;}},true);
  document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pt')&&e.target.tagName==='SPAN'){e.preventDefault();e.target.click();}if(e.key==='Escape')tip.hidden=true;});
  function marca(root){
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
      const pe=n.parentElement;if(!pe||pe.closest('span.pt,rt,script,style,textarea,input,#ptTip'))return NodeFilter.FILTER_REJECT;
      if(!/[をに]/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
      if(!pe.closest('[lang="ja"],.jpl,#pilula,.alvo,.ouvi,#estado,.gram'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});
    const nos=[];while(w.nextNode())nos.push(w.currentNode);
    nos.forEach(n=>{
      const t=n.nodeValue,frag=document.createDocumentFragment();let ult=0,mudou=false;
      for(let i=0;i<t.length;i++){const ch=t[i];let tipo=null;
        if(ch==='を')tipo='o';
        else if(ch==='に'){const dep=t.slice(i+1);const ant=t[i-1],pos=t[i+1];
          if(VERBO.test(dep)||t.trim()==='に'||(/\s|^$/.test(ant||'')&&/\s|^$/.test(pos||'')))tipo='ni';}
        if(!tipo)continue;
        if(i>ult)frag.appendChild(document.createTextNode(t.slice(ult,i)));
        const sp=document.createElement('span');sp.className='pt '+tipo;sp.textContent=ch;sp.tabIndex=0;sp.setAttribute('role','button');
        sp.setAttribute('aria-label',tipo==='o'?'を: liga a coisa. Toque para ver':'に: liga o lugar. Toque para ver');
        frag.appendChild(sp);ult=i+1;mudou=true;}
      if(!mudou)return;if(ult<t.length)frag.appendChild(document.createTextNode(t.slice(ult)));n.parentNode.replaceChild(frag,n);});
  }
  let ag=false;const roda=()=>{if(ag)return;ag=true;requestAnimationFrame(()=>{ag=false;obs.disconnect();try{marca(document.body);}finally{obs.observe(document.body,{childList:true,subtree:true,characterData:true});}});};
  const obs=new MutationObserver(roda);obs.observe(document.body,{childList:true,subtree:true,characterData:true});roda();
})();
</script>

<script>
/* romaji ao lado de todo japonês solto (botão Romaji) */
(function(){
  const T={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po'};
  const Y={ゃ:'a',ゅ:'u',ょ:'o'};
  const kh=t=>t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
  function ro(run){
    const k=kh(run);let out='',dbl=false;
    for(let i=0;i<k.length;i++){const c=k[i];
      if(c==='っ'){dbl=true;continue;}
      if(c==='ー'){out+=out.slice(-1);continue;}
      let r=T[c];if(r===undefined)return null;
      const n=k[i+1];
      if(n&&Y[n]){r=(r.endsWith('i')?r.slice(0,-1):r);if(/^(sh|ch|j)$/.test(r))r=r+Y[n];else r=r+'y'+Y[n];i++;}
      if(dbl){r=(r[0]==='c'&&r[1]==='h'?'t':r[0])+r;dbl=false;}
      out+=r;}
    return out.replace(/ō/g,'ō').replace(/([o])u/g,'ō').replace(/oo/g,'ō').replace(/uu/g,'ū');
  }
  const JA=/[぀-ヿー]+/g;
  function bloco(el){
    if(el.dataset.roAuto)return;el.dataset.roAuto='1';
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('rt,.ro,.ro-in,.jpl,.moldebox,.alvo,button,script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nos=[];while(w.nextNode())nos.push(w.currentNode);
    const juntos=nos.map(n=>n.nodeValue).join('');let pos=0;const mapa=nos.map(n=>{const a=pos;pos+=n.nodeValue.length;return [a,pos,n];});
    const runs=[];let m;JA.lastIndex=0;while((m=JA.exec(juntos)))runs.push([m.index,m.index+m[0].length,m[0]]);
    for(let r=runs.length-1;r>=0;r--){
      const [a,b,txt]=runs[r];const rom=ro(txt);if(!rom)continue;
      const seg=mapa.find(x=>x[0]<b&&b<=x[1]);if(!seg)continue;
      let nd=seg[2];const off=b-seg[0];
      if(off<nd.nodeValue.length)nd.splitText(off);
      const sp=document.createElement('span');sp.className='ro-in';sp.textContent=' ('+rom+')';
      nd.parentNode.insertBefore(sp,nd.nextSibling);
    }
  }
  const SEL='#painel h2,#painel > p,#painel .gram,#pilula .gram,#painel .ptdica,#painel .fim-bloco p';
  let ag=false;const roda=()=>{if(ag)return;ag=true;requestAnimationFrame(()=>{ag=false;obs.disconnect();try{document.querySelectorAll(SEL).forEach(bloco);}finally{obs.observe(document.body,{childList:true,subtree:true});}});};
  const obs=new MutationObserver(roda);obs.observe(document.body,{childList:true,subtree:true});roda();
})();
</script>
