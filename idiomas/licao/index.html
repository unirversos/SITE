<!DOCTYPE html>
<html lang="pt-BR" data-login="obrigatorio">
<head>
<meta charset="UTF-8">
<style>html[data-login="obrigatorio"]:not(.uni-ok) body>*:not(#uni-gate){visibility:hidden}</style>
<script type="module" src="/idiomas/dados/conta.js?v=6"></script>
<script>setTimeout(function(){var h=document.documentElement;if(!h.classList.contains('uni-ok')&&!document.getElementById('uni-gate'))h.classList.add('uni-ok')},10000)</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lição de casa | Unirversos Idiomas</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>body{margin:0;font-family:"Zen Maru Gothic",system-ui,sans-serif;background:#fdf6f4;color:#3a2b38}.w{max-width:520px;margin:12vh auto;padding:0 20px;text-align:center}.card{background:#fff;border:2px solid #ecdadd;border-left:6px solid #c23f5e;border-radius:18px;padding:28px 22px}h1{margin:0 0 8px;font:800 24px "Baloo 2",system-ui,sans-serif}p{margin:8px 0;color:#705f6c}a.b,button{display:inline-block;margin-top:14px;font:inherit;font-weight:700;border:0;background:#c23f5e;color:#fff;border-radius:99px;padding:12px 22px;text-decoration:none;cursor:pointer}[hidden]{display:none!important}</style>
<script defer src="/voltar-global.js?v=4"></script></head><body><div class="w"><div class="card"><h1 id="t">📝 Lição de casa</h1><p id="s">Abrindo no seu caderno…</p><button type="button" id="ab" hidden>Abrir a lição de casa</button><br><a class="b" href="/idiomas/caderno/" style="background:#fff;color:#c23f5e;border:2px solid #ecdadd">Ir ao Caderno</a></div></div>
<script src="/idiomas/dados/licao-casa.js?v=2"></script>
<script defer src="/caderno-flutuante.js?v=15"></script>
<script>
(function(){
  var m=(new URLSearchParams(location.search).get('m')||'').toLowerCase(),L=window.UniLicao;
  if(!L||L.slugs.indexOf(m)<0){location.replace('/idiomas/caderno/');return;}
  function abre(){L.abrir(m,(window.AULAS||{})[m]);}
  function pronto(){ document.getElementById('t').textContent='📝 '+L.titulo(m,(window.AULAS||{})[m]); document.getElementById('s').textContent='Abrindo no seu caderno… Se não abrir sozinho, toque no botão.'; var b=document.getElementById('ab'); b.hidden=false; b.onclick=abre; abre(); }
  if(m==='aulazero') return pronto();
  var sc=document.createElement('script'); sc.src='/idiomas/dados/aulas/'+m+'.js?v=1'; sc.onload=pronto; sc.onerror=function(){location.replace('/idiomas/caderno/');}; document.head.appendChild(sc);
})();
</script></body></html>
