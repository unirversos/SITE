name: Baixar fotos (skincare)
# Só roda no ramo fotos-skincare. Baixa páginas e imagens listadas em tools/fotos/pedidos.json
# e grava em tools/fotos/saida/. Não mexe no site publicado (ramo main).
on:
  push:
    branches: [fotos-skincare]
    paths: ['tools/fotos/pedidos.json', 'tools/fotos/run.py']
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fotos/run.py
      - run: |
          git config user.name "fotos-bot"
          git config user.email "fotos-bot@users.noreply.github.com"
          git add tools/fotos/saida
          git commit -m "fotos: resultado da busca" || echo "nada novo"
          git push
